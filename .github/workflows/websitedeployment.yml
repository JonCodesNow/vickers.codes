name: website deployment

on:
  pull_request:
    branches:
      - '*'
    types:
      - opened
      - synchronize

jobs:
  # Step 1: Apply Terraform to create the S3 bucket and related resources
  terraform_create_s3_and_policies:
    runs-on: ubuntu-22.04
    steps:
      # Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.5.0

      # Checkout the repository to ensure all files are available
      - name: Checkout Repository
        uses: actions/checkout@v2

      # Debug: List files to verify that bucket.json is present
      - name: List repository files
        run: ls -R

      # Configure AWS credentials from GitHub Secrets
      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          echo -e "[default]\naws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}\naws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" > ~/.aws/credentials

      # Run Terraform to apply the S3 bucket and bucket policy using bucket.json
      - name: Apply Terraform for S3 Bucket and Policies
        run: |
          cd $GITHUB_WORKSPACE/terraform
          terraform init -reconfigure
          terraform apply -target=aws_s3_bucket.s3_bucket \
                          -target=aws_s3_bucket_policy.s3_policy \
                          -target=aws_s3_bucket_acl.s3_bucket_acl \
                          -target=aws_s3_bucket_website_configuration.vickers_codes -auto-approve



  # Step 2: Sync files to the S3 bucket
  sync_site_files:
    needs: terraform_create_s3_and_policies
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Create AWS credentials directory
        run: mkdir -p ~/.aws

      - name: Configure AWS credentials
        run: echo -e "[default]\naws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}\naws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" > ~/.aws/credentials

      - uses: ruby/setup-ruby@v1.172.0 
        with:
          ruby-version: '3.1'

      - name: Install Bundler
        run: | 
          cd $GITHUB_WORKSPACE/online-cv
          bundle install

      - name: Generate Site files
        run: |
          cd $GITHUB_WORKSPACE/online-cv
          bundle exec jekyll build 

      - name: List Site Files
        run: ls -R online-cv/_site

      - name: Install AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: Sync _site files to S3 bucket
        run: aws s3 sync online-cv/_site s3://vickers.codes --region us-east-1

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id E1IL2QS3Q95ACA --paths "/*"

  # Step 3: Apply the rest of the Terraform state (CloudFront distribution, etc.)
  terraform_apply_rest:
    needs: sync_site_files
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Create AWS credentials directory
        run: mkdir -p ~/.aws

      - name: Configure AWS credentials
        run: echo -e "[default]\naws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}\naws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" > ~/.aws/credentials

      # Initialize Terraform Backend
      - name: Initialize Terraform Backend
        run: |
          cd $GITHUB_WORKSPACE/terraform
          terraform init -reconfigure

      # Apply the rest of the Terraform state (including CloudFront)
      - name: Apply Remaining Terraform Resources
        run: |
          cd $GITHUB_WORKSPACE/terraform
          terraform apply -auto-approve
